name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies (weasyprint)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gettext \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libharfbuzz0b

      - name: Install pretix and plugin
        run: |
          python -m pip install --upgrade pip
          pip install pretix
          pip install -e ".[dev]"

      - name: Run unit tests
        env:
          DJANGO_SETTINGS_MODULE: pretix.testutils.settings
        run: pytest pretix_payment_fees/tests/ -v

  build:
    name: Build wheel (sanity check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7
